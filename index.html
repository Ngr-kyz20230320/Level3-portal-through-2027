<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>簿記3級 質問ポータル</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fa;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic","YuGothic","Meiryo",sans-serif;line-height:1.6}
.page{width:min(900px,calc(100% - 32px));margin:32px auto;padding:38px;background:#fff;border:1px solid #d9dee7;border-radius:14px}
.eyebrow{display:inline-block;margin-bottom:4px;font-size:14px;font-weight:700;letter-spacing:.08em;color:#22577a}
.header h1{margin:0;font-size:36px;line-height:1.3}
.lead{margin:8px 0 0;color:#667085}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:30px}
.card{display:block;padding:24px;border:1px solid #d9dee7;border-radius:12px;background:#fff;color:#222;text-decoration:none;transition:.15s ease}
.card:hover,.card:focus-visible{border-color:#22577a;background:#f7fbfe;outline:none;transform:translateY(-1px)}
.card h2{margin:0 0 5px;font-size:22px}
.card p{margin:0;color:#667085;font-size:14px}
.section{margin-top:30px;padding-top:22px;border-top:1px solid #e3e7ed}
.section h2{margin:0 0 8px;font-size:18px}
.section p{margin:0;color:#667085}
footer{margin-top:34px;color:#98a2b3;font-size:12px;text-align:center}
@media(max-width:600px){.page{width:min(100% - 20px,900px);margin:10px auto;padding:24px 18px}.grid{grid-template-columns:1fr}.header h1{font-size:30px}}
</style>
</head>
<body>
<main class="page">
  <header class="header">
    <span class="eyebrow">簿記3級</span>
    <h1>質問ポータル</h1>
    <p class="lead">質問したい教材の種類を選択してください。</p>
  </header>

  <section class="grid" aria-label="教材種類">
    <a class="card" href="text.html">
      <h2>テキスト</h2>
      <p>テキスト内の問題について質問します。</p>
    </a>

    <a class="card" href="mndi.html">
      <h2>問題演習</h2>
      <p>問題演習の問題について質問します。</p>
    </a>

    <a class="card" href="trng.html">
      <h2>トレーニング</h2>
      <p>トレーニングの問題について質問します。</p>
    </a>

    <a class="card" href="mogi.html">
      <h2>模擬試験</h2>
      <p>模擬試験の問題について質問します。</p>
    </a>
  </section>

  <section class="section">
    <h2>質問の流れ</h2>
    <p>教材を選択し、質問する問題を指定してから、受講生からの質問内容を入力してください。</p>
  </section>

  <footer>簿記3級 質問支援ページ</footer>
</main>
</body>
</html>
